<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Blog post">
  <!-- 16:9 neutral placeholder for blog posts without a cover image -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f6"/>
      <stop offset="1" stop-color="#e8eeed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- subtle skyline blocks -->
  <g fill="#d3dddb">
    <rect x="140" y="330" width="120" height="215"/>
    <rect x="300" y="270" width="150" height="275"/>
    <rect x="490" y="360" width="110" height="185"/>
    <rect x="640" y="240" width="160" height="305"/>
    <rect x="840" y="320" width="130" height="225"/>
    <rect x="1010" y="380" width="90" height="165"/>
  </g>
  <!-- windows -->
  <g fill="#c1cecb">
    <rect x="322" y="292" width="22" height="22"/><rect x="364" y="292" width="22" height="22"/><rect x="406" y="292" width="22" height="22"/>
    <rect x="322" y="334" width="22" height="22"/><rect x="364" y="334" width="22" height="22"/><rect x="406" y="334" width="22" height="22"/>
    <rect x="662" y="262" width="24" height="24"/><rect x="708" y="262" width="24" height="24"/><rect x="754" y="262" width="24" height="24"/>
    <rect x="662" y="308" width="24" height="24"/><rect x="708" y="308" width="24" height="24"/><rect x="754" y="308" width="24" height="24"/>
  </g>
  <!-- ground line -->
  <rect x="0" y="545" width="1200" height="4" fill="#0f766e" opacity="0.35"/>
</svg>
